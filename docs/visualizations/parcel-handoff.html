.form-check:not(.form-switch)

  height: 100%;

}

.form-check:not(.form-switch) .form-check-input:disabled {

}

.form-switch .form-check-input:disabled,

.form-switch .form-check-input {

  left: 0;

  height: 16px;

  background: light-dark(var(--primary-foreground), var(--foreground));

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-webkit-slider-runnable-track {

.form-range:focus-visible::-webkit-slider-thumb {

}

.form-range::-moz-range-track {

}

.form-range::-moz-range-thumb {

  height: 20px;

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {

}

.btn:not(.btn-primary, .viz-tile):is(

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

@media (pointer: coarse) {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;parcel-handoff-viz&#x27;);
      const buttons = [...root.querySelectorAll(&#x27;[data-stage]&#x27;)];
      const localeButtons = [...root.querySelectorAll(&#x27;[data-locale-choice]&#x27;)];
      const icon = root.querySelector(&#x27;.parcel-selected-icon i&#x27;);
      const title = root.querySelector(&#x27;[data-selected-title]&#x27;);
      const detail = root.querySelector(&#x27;[data-selected-detail]&#x27;);
      const stages = [
        {
          icon: &#x27;shopping-cart&#x27;,
          ko: [&#x27;주문 접수&#x27;, &#x27;쇼핑몰이 주문번호를 만들고 결제 확인 정보를 물류센터로 보냅니다.&#x27;],
          en: [&#x27;Order accepted&#x27;, &#x27;The store creates the order number and sends payment confirmation to fulfillment.&#x27;],
        },
        {
          icon: &#x27;package&#x27;,
          ko: [&#x27;상품 포장&#x27;, &#x27;물류센터가 상품을 찾아 포장하고 배송기사에게 넘깁니다.&#x27;],
          en: [&#x27;Parcel packed&#x27;, &#x27;Fulfillment finds and packs the item, then hands it to the courier.&#x27;],
        },
        {
          icon: &#x27;truck&#x27;,
          ko: [&#x27;배송 중&#x27;, &#x27;배송기사가 택배를 우리 동네로 옮기고 도착 알림을 보냅니다.&#x27;],
          en: [&#x27;Out for delivery&#x27;, &#x27;The courier moves the parcel through the neighborhood and sends an arrival notice.&#x27;],
        },
        {
          icon: &#x27;house&#x27;,
          ko: [&#x27;문 앞 도착&#x27;, &#x27;배송 사진을 확인하고 택배를 안전하게 수령합니다.&#x27;],
          en: [&#x27;At your door&#x27;, &#x27;Check the delivery photo and safely collect the parcel.&#x27;],
        },
      ];

      function localized(value) {
        return value[root.dataset.locale === &#x27;en&#x27; ? &#x27;en&#x27; : &#x27;ko&#x27;];
      }

      function update(index) {
        const stage = stages[index];
        buttons.forEach((button, buttonIndex) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(buttonIndex === index));
        });
        icon.setAttribute(&#x27;data-lucide&#x27;, stage.icon);
        const [selectedTitle, selectedDetail] = localized(stage);
        title.textContent = selectedTitle;
        detail.textContent = selectedDetail;
        if (window.lucide) window.lucide.createIcons({attrs: {width: 16, height: 16}});
      }

      function setLocale(locale) {
        root.dataset.locale = locale;
        localeButtons.forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.localeChoice === locale));
        });
        const selected = buttons.findIndex((button) =&gt; button.getAttribute(&#x27;aria-pressed&#x27;) === &#x27;true&#x27;);
        update(selected &lt; 0 ? 3 : selected);
      }

      buttons.forEach((button, index) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; update(index)));
      localeButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setLocale(button.dataset.localeChoice)));
      setLocale(navigator.language.toLowerCase().startsWith(&#x27;ko&#x27;) ? &#x27;ko&#x27; : &#x27;en&#x27;);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;

  let positionRequest = 0;
  let skipDelayUntil = 0;

  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)

    );

      ids.add(tooltipId);

    }

      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);

    }

  };

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {

    activeTrigger = null;
    tooltip?.remove();

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,

            );

              &quot;--tooltip-available-height&quot;,

    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {

  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

      openTooltip(trigger);

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
