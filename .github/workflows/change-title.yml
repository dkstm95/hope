name: Change title

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: AI-readable change title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the pull request or main head title
        env:
          HOPE_CHANGE_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: node tools/check-change-title.mjs
