name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

run-name: Release Hope (recorded version)

permissions:
  contents: write

concurrency:
  group: hope-release
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require the intended release source
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          test "${EVENT_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${EVENT_SHA}"
      - name: Choose release mode
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          CURRENT_TAG="v${CURRENT_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${CURRENT_TAG}^{commit}" > /dev/null; then
            if gh release view "${CURRENT_TAG}" > /dev/null 2>&1; then
              MODE=none
              PUBLISH=false
            else
              MODE=resume
              PUBLISH=true
            fi
          elif [ "${EVENT_NAME}" = "push" ]; then
            PREVIOUS_VERSION="$(git show "${BEFORE_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            if [ "${PREVIOUS_VERSION}" = "${CURRENT_VERSION}" ]; then
              MODE=none
              PUBLISH=false
            else
              MODE=recorded
              PUBLISH=true
            fi
          else
            MODE=recorded
            PUBLISH=true
          fi
          {
            echo "current-version=${CURRENT_VERSION}"
            echo "current-tag=${CURRENT_TAG}"
            echo "mode=${MODE}"
            echo "publish=${PUBLISH}"
          } >> "${GITHUB_OUTPUT}"
      - name: Restore interrupted release source
        if: steps.plan.outputs.mode == 'resume'
        run: git checkout --detach "${{ steps.plan.outputs.current-tag }}"
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - name: Prepare recorded version
        id: release
        if: steps.plan.outputs.publish == 'true'
        run: |
          npm run release:prepare -- "${{ steps.plan.outputs.current-version }}"
          RELEASE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" > /dev/null; then
            if [ "${{ steps.plan.outputs.mode }}" != "resume" ]; then
              echo "Release tag ${RELEASE_TAG} already exists unexpectedly" >&2
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          elif [ "${{ steps.plan.outputs.mode }}" = "resume" ]; then
            echo "Release tag ${RELEASE_TAG} disappeared before recovery" >&2
            exit 1
          fi
          {
            echo "version=${RELEASE_VERSION}"
            echo "tag=${RELEASE_TAG}"
          } >> "${GITHUB_OUTPUT}"
      - if: steps.plan.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.plan.outputs.publish == 'true'
        run: npm run test:browser
      - name: Check generated plugin
        if: steps.plan.outputs.publish == 'true'
        run: |
          git diff --exit-code -- package.json package-lock.json plugins/hope tools/plugin-package-files.txt
      - name: Stage plugin package
        if: steps.plan.outputs.publish == 'true'
        run: node tools/stage-plugin.mjs "${RUNNER_TEMP}/hope-package"
      - name: Package plugin
        if: steps.plan.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/hope-package
        run: zip -r "${GITHUB_WORKSPACE}/hope-${{ steps.release.outputs.tag }}.zip" .
      - name: Check package root
        if: steps.plan.outputs.publish == 'true'
        run: |
          unzip -Z1 "hope-${{ steps.release.outputs.tag }}.zip" | sed '/\/$/d' | sort > "${RUNNER_TEMP}/plugin-package-files.txt"
          diff -u tools/plugin-package-files.txt "${RUNNER_TEMP}/plugin-package-files.txt"
          unzip -p "hope-${{ steps.release.outputs.tag }}.zip" .claude-plugin/plugin.json > /dev/null
          unzip -p "hope-${{ steps.release.outputs.tag }}.zip" .codex-plugin/plugin.json > /dev/null
          unzip -p "hope-${{ steps.release.outputs.tag }}.zip" skills/diff/SKILL.md > /dev/null
          unzip -p "hope-${{ steps.release.outputs.tag }}.zip" skills/write/SKILL.md > /dev/null
          unzip -p "hope-${{ steps.release.outputs.tag }}.zip" skills/write/references/writing-standard.md > /dev/null
          sha256sum "hope-${{ steps.release.outputs.tag }}.zip" > "hope-${{ steps.release.outputs.tag }}.zip.sha256"
      - name: Publish recorded release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.plan.outputs.mode }}" != "resume" ]; then
            git tag -a "${{ steps.release.outputs.tag }}" -m "Hope ${{ steps.release.outputs.tag }}"
            git push origin "${{ steps.release.outputs.tag }}"
          fi
          gh release create "${{ steps.release.outputs.tag }}" \
            "hope-${{ steps.release.outputs.tag }}.zip" \
            "hope-${{ steps.release.outputs.tag }}.zip.sha256" \
            --title "Hope ${{ steps.release.outputs.tag }}" \
            --generate-notes \
            --fail-on-no-commits \
            --latest \
            --verify-tag
