name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - plugins/hope/.codex-plugin/plugin.json
      - plugins/hope/.claude-plugin/plugin.json
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment after an existing release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

run-name: Release Hope (${{ inputs.increment || 'recorded version' }})

permissions:
  contents: write

concurrency:
  group: hope-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Require the main branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git branch --show-current)" = "main"
      - name: Choose release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INCREMENT: ${{ inputs.increment }}
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          CURRENT_TAG="v${CURRENT_VERSION}"
          PUBLISH=true
          if git rev-parse --verify --quiet "refs/tags/${CURRENT_TAG}^{commit}" > /dev/null; then
            if gh release view "${CURRENT_TAG}" > /dev/null 2>&1; then
              if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                RELEASE_VERSION="$(node tools/next-release-version.mjs "${CURRENT_VERSION}" "${INCREMENT}")"
                RESUME_TAG=false
              else
                RELEASE_VERSION="${CURRENT_VERSION}"
                RESUME_TAG=false
                PUBLISH=false
              fi
            else
              RELEASE_VERSION="${CURRENT_VERSION}"
              RESUME_TAG=true
            fi
          else
            RELEASE_VERSION="${CURRENT_VERSION}"
            RESUME_TAG=false
          fi
          RELEASE_TAG="v${RELEASE_VERSION}"
          if [ "${PUBLISH}" = "false" ]; then
            TAG_EXISTS=true
          elif git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" > /dev/null; then
            if [ "${RESUME_TAG}" = "true" ]; then
              TAG_EXISTS=true
            else
              echo "Release tag ${RELEASE_TAG} already exists unexpectedly" >&2
              exit 1
            fi
          else
            TAG_EXISTS=false
          fi
          {
            echo "version=${RELEASE_VERSION}"
            echo "tag=${RELEASE_TAG}"
            echo "tag-exists=${TAG_EXISTS}"
            echo "resume-tag=${RESUME_TAG}"
            echo "publish=${PUBLISH}"
          } >> "${GITHUB_OUTPUT}"
      - name: Restore interrupted release commit
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.resume-tag == 'true'
        run: git checkout --detach "${{ steps.version.outputs.tag }}"
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - name: Prepare release
        if: steps.version.outputs.publish == 'true'
        run: npm run release:prepare -- "${{ steps.version.outputs.version }}"
      - if: steps.version.outputs.publish == 'true'
        run: npm run check
      - if: steps.version.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.version.outputs.publish == 'true'
        run: npm run test:browser
      - name: Build plugin
        if: steps.version.outputs.publish == 'true'
        run: |
          npm run build:plugin
          git diff --exit-code -- plugins/hope \
            ':(exclude)plugins/hope/.codex-plugin/plugin.json' \
            ':(exclude)plugins/hope/.claude-plugin/plugin.json'
      - name: Commit new version
        if: steps.version.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json plugins/hope/.codex-plugin/plugin.json plugins/hope/.claude-plugin/plugin.json
          if ! git diff --cached --quiet; then
            git commit -m "Release Hope ${{ steps.version.outputs.version }}"
          fi
      - name: Tag and push release commit
        if: steps.version.outputs.publish == 'true'
        run: |
          if [ "${{ steps.version.outputs.tag-exists }}" = "false" ]; then
            git tag -a "${{ steps.version.outputs.tag }}" -m "Hope ${{ steps.version.outputs.tag }}"
            git push origin HEAD:main "${{ steps.version.outputs.tag }}"
          fi
      - name: Stage plugin package
        if: steps.version.outputs.publish == 'true'
        run: node tools/stage-plugin.mjs "${RUNNER_TEMP}/hope-package"
      - name: Package plugin
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/hope-package
        run: zip -r "${GITHUB_WORKSPACE}/hope-${{ steps.version.outputs.tag }}.zip" .
      - name: Check package root
        if: steps.version.outputs.publish == 'true'
        run: |
          unzip -Z1 "hope-${{ steps.version.outputs.tag }}.zip" | sed '/\/$/d' | sort > "${RUNNER_TEMP}/plugin-package-files.txt"
          diff -u tools/plugin-package-files.txt "${RUNNER_TEMP}/plugin-package-files.txt"
          unzip -p "hope-${{ steps.version.outputs.tag }}.zip" .claude-plugin/plugin.json > /dev/null
          unzip -p "hope-${{ steps.version.outputs.tag }}.zip" .codex-plugin/plugin.json > /dev/null
          unzip -p "hope-${{ steps.version.outputs.tag }}.zip" skills/diff/SKILL.md > /dev/null
          unzip -p "hope-${{ steps.version.outputs.tag }}.zip" skills/write/SKILL.md > /dev/null
          unzip -p "hope-${{ steps.version.outputs.tag }}.zip" runtime/features/write/cli.mjs > /dev/null
          unzip -p "hope-${{ steps.version.outputs.tag }}.zip" runtime/features/write/standard.md > /dev/null
          sha256sum "hope-${{ steps.version.outputs.tag }}.zip" > "hope-${{ steps.version.outputs.tag }}.zip.sha256"
      - name: Create release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "hope-${{ steps.version.outputs.tag }}.zip"
          "hope-${{ steps.version.outputs.tag }}.zip.sha256"
          --title "Hope ${{ steps.version.outputs.tag }}"
          --generate-notes
          --fail-on-no-commits
          --latest
          --verify-tag
